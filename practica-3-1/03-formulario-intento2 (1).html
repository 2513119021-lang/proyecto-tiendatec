<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Listas y Tablas</title></head>
<body>
<h1>Catalogo en dos formatos</h1>

<h2>Version Lista</h2>
<ul>
  <li>Cien Años de Soledad
    <dl><dt>Autor</dt><dd>Garcia Marquez</dd><dt>Precio</dt><dd>$299</dd></dl>
  </li>
  <li>Don Quijote
    <dl><dt>Autor</dt><dd>Cervantes</dd><dt>Precio</dt><dd>$350</dd></dl>
  </li>
</ul>
<!-- COMENTARIO: Usaria lista para mostrar catalogo visual para usuarios, es mas flexible y semantica para navegar -->

<h2>Version Tabla</h2>
<table>
  <thead><tr><th>Titulo</th><th>Autor</th><th>Genero</th><th>Precio</th></tr></thead>
  <tbody>
    <tr><td>Cien Años de Soledad</td><td>Garcia Marquez</td><td>Realismo</td><td>$299</td></tr>
    <tr><td>Don Quijote</td><td>Cervantes</td><td>Clasica</td><td>$350</td></tr>
  </tbody>
</table>
<!-- COMENTARIO: Usaria tabla solo cuando necesito comparar datos reales y ordenarlos por columnas, como reporte de inventario -->

</body>
</html>
